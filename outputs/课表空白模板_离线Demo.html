<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e9"><title>课表空白模板 · 离线Demo</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiNjOTY0NDIiLz4KICA8cGF0aCBkPSJNMTggMTZ2OE00NiAxNnY4TTE0IDI3aDM2TTE4IDM0aDh2OGgtOHptMTIgMGg4djhoLTh6bTEyIDBoOHY4aC04ek0xOCA0Nmg4djZoLTh6bTEyIDBoOHY2aC04eiIgc3Ryb2tlPSIjZmZmYWYzIiBzdHJva2Utd2lkdGg9IjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgZmlsbD0ibm9uZSIvPgo8L3N2Zz4K"><style>:root {
  --paper: #f5f1e9;
  --paper-deep: #ebe4d9;
  --surface: #fffdf8;
  --ink: #2d2a26;
  --muted: #716b63;
  --line: #d9d2c7;
  --accent: #c96442;
  --accent-soft: #f0d9cd;
  --radius: 16px;
  --max: 1180px;
  color-scheme: light;
  font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  font-synthesis: none;
  background: var(--paper);
  color: var(--ink);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; min-width: 320px; background: var(--paper); }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; }

.topbar {
  position: fixed;
  z-index: 20;
  inset: 0 0 auto;
  height: 64px;
  padding: 0 max(22px, calc((100vw - var(--max)) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px);
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: .02em; }
.brand-mark { width: 15px; height: 15px; border-radius: 4px; background: var(--accent); transform: rotate(-6deg); }
.topbar nav { display: flex; gap: 4px; }
.topbar nav a { padding: 9px 13px; border-radius: 10px; color: var(--muted); font-size: 14px; transition: background .18s ease, color .18s ease; }
.topbar nav a:hover, .topbar nav a:focus-visible { background: var(--surface); color: var(--ink); outline: none; }

.section-anchor { scroll-margin-top: 64px; }
.hero {
  min-height: 100svh;
  padding: 108px 24px 54px;
  display: grid;
  place-items: center;
  position: relative;
}

.hero-inner { width: min(850px, 100%); text-align: center; }
.eyebrow { margin: 0 0 18px; font-size: 12px; font-weight: 750; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
.hero-time, .focus-clock {
  font-family: Georgia, "Times New Roman", "Songti SC", serif;
  font-variant-numeric: tabular-nums;
  line-height: .9;
  letter-spacing: -.065em;
}
.hero-time { font-size: clamp(72px, 14vw, 164px); }
.hero-date { margin: 22px 0 34px; color: var(--muted); font-size: clamp(15px, 2vw, 19px); }

.status-card {
  max-width: 610px;
  margin: 0 auto;
  padding: 25px 28px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.status-card h2 { margin: 8px 0 7px; font-family: Georgia, "Songti SC", serif; font-size: clamp(25px, 4vw, 38px); font-weight: 500; }
.status-card p { margin: 0; color: var(--muted); line-height: 1.65; }
.status-kicker { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .12em; }
.scroll-cue {
  position: absolute;
  bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
}
.scroll-cue b { color: var(--accent); font-size: 22px; font-weight: 400; }

.page { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; padding: 92px 0 104px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 36px; margin-bottom: 30px; }
.section-heading h1 { margin: 0; font: 500 clamp(38px, 6vw, 68px)/1.02 Georgia, "Songti SC", serif; letter-spacing: -.035em; }
.section-heading > p { max-width: 420px; margin: 0 0 7px; color: var(--muted); line-height: 1.7; }

.overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.panel {
  min-width: 0;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }
.panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.panel-heading h2 { margin: 0; font: 500 23px/1.2 Georgia, "Songti SC", serif; }
.panel-heading span { color: var(--muted); font-size: 12px; }

.progress-stack { display: grid; gap: 21px; }
.progress-item { min-width: 0; }
.progress-copy { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 8px; font-size: 13px; }
.progress-copy span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-track { height: 7px; overflow: hidden; border-radius: 10px; background: var(--paper-deep); }
.progress-track > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .35s ease; }

.event-list { display: grid; gap: 10px; }
.event-card {
  --course: var(--accent);
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 17px;
  padding: 15px 16px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--course);
  border-radius: 12px;
  background: var(--paper);
}
.event-time { font-size: 15px; font-weight: 720; font-variant-numeric: tabular-nums; }
.event-time small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 500; }
.event-card h3 { margin: 0 0 5px; font-size: 15px; }
.event-card p { margin: 0; color: var(--muted); font-size: 12px; }
.event-card .subtle { margin-top: 3px; color: #918a81; }
.empty-state { color: var(--muted); font-size: 14px; line-height: 1.7; padding: 10px 0; }

.free-list { display: grid; gap: 11px; }
.free-list > div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
.free-list > div:last-child { border-bottom: 0; }
.free-list strong { font-size: 13px; }
.free-list span { color: var(--muted); font-size: 12px; }
.holiday strong { display: block; margin-bottom: 12px; font: 500 33px/1.1 Georgia, "Songti SC", serif; }
.holiday span { color: var(--muted); }
.holiday p { margin: 32px 0 0; color: var(--accent); font-weight: 700; }

.course-progress-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 30px; }
.course-progress { --course: var(--accent); }
.course-progress .progress-track > span { background: var(--course); }
.course-progress .progress-copy { display: none; }
.course-label { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 9px; align-items: center; margin-bottom: 9px; }
.course-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--course); }
.course-label strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.course-label small { color: var(--muted); font-size: 11px; }

.focus-page {
  min-height: 100svh;
  padding: 105px 24px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--ink);
  color: var(--surface);
}
.focus-clock { font-size: clamp(82px, 18vw, 210px); }
.focus-date { margin: 24px 0 58px; color: #bdb7ae; }
.focus-state { width: min(760px, 100%); }
.focus-state h1 { margin: 10px 0 15px; font: 500 clamp(34px, 6vw, 66px)/1.08 Georgia, "Songti SC", serif; }
.focus-state > p { margin: 0; color: #c9c3bb; line-height: 1.7; }
.focus-progress { margin-top: 34px; text-align: left; }
.focus-progress .progress-track { background: #4b4741; height: 9px; }
.focus-progress .progress-copy span:last-child { color: #c9c3bb; }
.countdown { display: inline-block; margin-top: 32px; padding: 13px 20px; border: 1px solid #5d5750; border-radius: 999px; color: #e8ded4; }
.back-link { margin-top: 64px; color: #aaa39a; font-size: 13px; }

.week-picker { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.week-picker select { min-height: 42px; padding: 0 34px 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
.week-picker select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
.schedule-scroll { overflow-x: auto; padding-bottom: 8px; }
.classic-grid {
  min-width: 1040px;
  min-height: 1240px;
  display: grid;
  grid-template-columns: 74px repeat(7, minmax(130px, 1fr));
  grid-template-rows: 48px repeat(15, 78px);
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.grid-corner, .day-head, .period-label { z-index: 2; background: var(--surface); }
.grid-corner { grid-column: 1; grid-row: 1; display: grid; place-items: center; color: var(--muted); font-size: 11px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day-head { grid-row: 1; display: grid; place-items: center; font-size: 13px; font-weight: 700; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.period-label { grid-column: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.period-label strong { font-family: Georgia, serif; font-size: 21px; font-weight: 500; }
.period-label span { color: var(--muted); font-size: 10px; }
.grid-guide { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.schedule-event {
  --course: var(--accent);
  z-index: 4;
  min-width: 0;
  margin: 4px;
  padding: 10px;
  overflow: hidden;
  border-radius: 9px;
  border-left: 4px solid var(--course);
  background: color-mix(in srgb, var(--course) 13%, var(--surface));
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.schedule-event strong { font-size: 12px; line-height: 1.35; }
.schedule-event span, .schedule-event small { color: var(--muted); font-size: 10px; }

.semester-weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.week-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.week-card header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.week-card header strong { font: 500 23px/1 Georgia, "Songti SC", serif; }
.week-card header span { color: var(--muted); font-size: 11px; }
.semester-day { display: grid; grid-template-columns: 42px 1fr; gap: 10px; min-height: 31px; padding: 6px 0; border-top: 1px solid var(--line); }
.semester-day > span { padding-top: 3px; color: var(--muted); font-size: 11px; }
.semester-day > div { display: flex; flex-wrap: wrap; gap: 5px; }
.semester-day i { --course: var(--accent); padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--course) 15%, var(--surface)); color: var(--ink); font-size: 10px; font-style: normal; }
.semester-day em { color: #b4ada4; font-style: normal; }

footer { padding: 30px 20px 46px; text-align: center; color: var(--muted); font-size: 11px; }

@media (max-width: 820px) {
  .topbar { padding-inline: 14px; }
  .topbar nav a:first-child { display: none; }
  .topbar nav a { padding-inline: 9px; font-size: 12px; }
  .page { width: min(100% - 24px, var(--max)); padding-block: 78px; }
  .section-heading { align-items: flex-start; flex-direction: column; gap: 17px; }
  .section-heading > p { max-width: none; }
  .overview-grid { grid-template-columns: 1fr; }
  .span-2, .span-3 { grid-column: auto; }
  .course-progress-grid, .semester-weeks { grid-template-columns: 1fr; }
  .focus-date { margin-bottom: 42px; }
}

@media (max-width: 520px) {
  .hero { padding-inline: 14px; }
  .status-card { padding: 21px; }
  .panel { padding: 19px; }
  .event-card { grid-template-columns: 62px 1fr; gap: 11px; }
  .hero-time { letter-spacing: -.075em; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* 公开模板：保留暖白、炭灰和陶土色；真实多页与胶囊计时器。 */
html{scroll-padding-top:0}
body{line-height:1.5}
.topbar{height:76px;background:var(--paper);backdrop-filter:none;gap:20px}
.topbar nav a{min-height:44px;display:inline-flex!important;align-items:center;font-size:14px}
.topbar nav a[aria-current=page]{background:var(--surface);color:var(--ink)}
.topbar nav{flex-wrap:wrap;justify-content:flex-end}
:focus-visible{outline:2px solid var(--accent)!important;outline-offset:4px}
.page{padding-top:120px}
.part{font:500 clamp(28px,5vw,48px)/1.2 Georgia,"Songti SC",serif;margin:10px 0 32px}
.home-next{margin:0 auto 24px;overflow-wrap:anywhere}
.home-next h2{font-size:clamp(23px,4vw,32px)}
.primary-link,button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;transition:background .18s}
.primary-link{background:var(--accent);color:white;border-color:var(--accent)}
button:hover{background:var(--paper-deep)}
button:disabled{cursor:default;opacity:.5}
.subtle{color:var(--muted)}
.panel>h2{font:500 24px Georgia,"Songti SC",serif;margin:0 0 24px}
.meter-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 10px}
.meter-title strong{font-size:14px}.meter-title span{font-size:13px;color:var(--muted)}
.meter{position:relative;height:26px;border-radius:999px;overflow:hidden;background:var(--paper-deep)}
.meter i{position:absolute;inset:0;background:color-mix(in srgb,var(--fill) 45%,var(--paper));transform-origin:left center;transition:transform .4s}
.meter small{position:relative;display:block;z-index:1;text-align:center;font-size:12px;line-height:26px;color:#2d2a26}
.is-ended{filter:grayscale(1);background:#eeeae4!important;color:#77716a!important;border-color:#d4d0c9!important}
.is-ended h3,.is-ended strong,.is-ended p{color:#77716a!important}
.free-list > div,.free-list > div.is-ended{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.free-list > div:last-child{border-bottom:1px solid var(--line)}
.free-list strong,.free-list span{line-height:1.5;font-variant-numeric:tabular-nums}
.free-list span{text-align:right;white-space:nowrap}
.calendar-details{margin-top:32px;padding:20px;border:1px solid var(--line);border-radius:12px;line-height:1.8}
summary{cursor:pointer;min-height:44px;display:list-item;padding:8px}
.calendar-details a{text-decoration:underline}
.immersive{background:var(--ink);color:var(--surface)}
.immersive .topbar{background:var(--ink);border-color:#504a44}
.immersive .topbar nav a{color:#d1c9c0}
.immersive .topbar nav a[aria-current=page],.immersive .topbar nav a:hover{background:#49433d;color:white}
.focus-page{padding:118px 24px 50px;min-height:100svh;justify-content:flex-start}
.focus-date{margin:0 0 26px}
.focus-clock{font-size:clamp(70px,12vw,160px)}
.focus-state{margin-top:25px}
.focus-state h1{font-size:clamp(26px,4vw,46px);margin:15px 0}
.state-pill{display:inline-block;border:1px solid #867667;border-radius:999px;padding:5px 15px;color:#edb69a;font-size:14px}
.timer-rotator{perspective:600px;margin:26px 0 16px}
#timer-label{color:#c9c3bb;font-size:14px}
#timer-value{display:block;font-size:clamp(25px,4vw,42px);font-weight:500;font-variant-numeric:tabular-nums}
.capsule{position:relative;isolation:isolate;overflow:hidden;max-width:720px;height:38px;border-radius:999px;background:#504841;margin:0 auto;border:1px solid #706153}
.capsule i{position:absolute;inset:0;background:#dba180;transform-origin:left center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.capsule small{position:relative;z-index:1;display:inline-block;line-height:24px;margin-top:6px;padding:0 12px;border-radius:999px;background:#302a25;color:#fff4ea;font-size:12px}
.mode-button{margin-top:20px;background:transparent;color:#e8d8ca;border-color:#796b60}
.mode-button:hover{background:#49413a}
.custom-panel{margin-top:26px;width:min(720px,100%);text-align:left;border-top:1px solid #65584d;color:#d8cfc6}
.custom-panel form{display:grid;gap:15px;padding:15px 0}
.custom-panel label{display:grid;gap:7px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:44px;max-width:100%}
.custom-panel input{width:100%;background:#403931;color:#fff7ee;border-color:#8f7a68;color-scheme:dark}
.form-actions{display:flex;gap:12px;flex-wrap:wrap}
#form-error{color:#ffb7a3;margin:0}#custom-hint{font-size:13px}
#holiday-note{color:#c9c3bb;font-size:13px}
.week-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.day-head{display:flex;flex-direction:column;justify-content:center;align-items:center}
.day-head small{font-size:11px;color:var(--muted)}
.classic-grid{grid-template-rows:60px repeat(15,78px)}
.time-table{width:100%;border-collapse:collapse;min-width:600px}
.time-table th,.time-table td{padding:10px;border:1px solid var(--line);text-align:center}
.semester-long{grid-template-columns:1fr;margin-top:26px;padding-bottom:75vh}
.week-card{scroll-margin-top:110px}
.semester-day{grid-template-columns:48px 1fr}
.semester-day i{font-size:13px;padding:6px 10px}
/* 即使浏览器未报告刘海高度，也保留28px顶部缓冲。 */
@media(max-width:820px),(pointer:coarse){
 :root{--camera-gap:max(28px,calc(env(safe-area-inset-top,0px) + 12px));--phone-side:max(12px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))}
 .topbar{height:auto;min-height:calc(92px + var(--camera-gap));padding:calc(10px + var(--camera-gap)) var(--phone-side) 10px;gap:8px;align-items:flex-start}
 .brand{padding-top:12px;white-space:nowrap}
 .topbar nav{gap:0;max-width:calc(100% - 65px)}
 .topbar nav a{font-size:12px;padding:6px 8px}
 .page{width:calc(100% - var(--phone-side) * 2);padding-top:calc(135px + var(--camera-gap));padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
 html{scroll-padding-top:0}
 .focus-page{padding:calc(140px + var(--camera-gap)) var(--phone-side) calc(50px + env(safe-area-inset-bottom,0px))}
 .hero{padding:calc(145px + var(--camera-gap)) var(--phone-side) calc(54px + env(safe-area-inset-bottom,0px))}
 .week-card{scroll-margin-top:calc(135px + var(--camera-gap))}
}
@media(prefers-reduced-motion:reduce){.capsule i,.meter i{transition:none}}
.progress-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid #796b60;border-radius:12px;margin-left:12px}
.progress-only .topbar{justify-content:space-between;padding-inline:max(24px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));border:0}
.back-focus{min-height:44px;display:inline-flex;align-items:center;color:#d8cfc6;font-size:14px}
#browser-fullscreen{background:transparent;color:#d8cfc6;border-color:#65584d;font-size:13px}
.progress-only .focus-page{min-height:100svh;justify-content:center;padding-inline:max(24px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))}
.progress-only .focus-state{width:min(1080px,100%);margin:0}
.progress-only .focus-state h1{font-size:clamp(26px,4vw,50px)}
.progress-only .timer-rotator{margin:38px 0 26px}
.progress-only #timer-value{font:500 clamp(32px,6vw,76px)/1.5 Georgia,"Songti SC",serif;font-variant-numeric:tabular-nums}
.progress-only .capsule{max-width:none;height:64px;border-radius:999px;background:#3f3933;border:1px solid #82705f}
.progress-only .capsule>i{background:#dba180}
.progress-only .capsule small{margin-top:20px;line-height:24px;z-index:4}
.rail-ticks{position:absolute;inset:0 24px;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:8px;pointer-events:none}
.rail-ticks b{height:7px;width:1px;background:#2d2a2680}

function tickFocus(t){
 if(custom&&custom.end<=+t){custom=null;save("public-template.custom",null);}
 const s=E.state(t,custom),elapsed=E.clamp((t-s.start)/(s.end-s.start)),remaining=mode==="remaining";
 const hasEnd=s.custom||s.kind==="class"||s.hasNext;
 if($("#focus-clock"))$("#focus-clock").textContent=E.clock(t);
 if($("#focus-date"))$("#focus-date").textContent=E.fmt(t)+" · "+weekLabel(t);
 $("#state-label").textContent=s.label+(s.custom?" · 自定义":"");
 $("#focus-title").textContent=s.custom?s.label:s.event?s.event.course.name:s.next?s.next.event.course.name:(D.courses.length?"本学期课程已结束":"尚未配置课程");
 $("#focus-detail").textContent=s.custom?"结束于 "+E.fmt(s.end)+" "+E.clock(s.end):s.event?s.event.room+" · "+s.event.teacher+" · "+E.clock(s.start)+"–"+E.clock(s.end):s.next?"下一节 · "+E.fmt(s.next.start)+" "+E.clock(s.next.start)+" · "+s.next.event.room:"可使用下方演示计时，或填写模板课程。";
 $("#timer-label").textContent=s.custom?(remaining?"距离结束":"已经持续"):s.kind==="class"?(remaining?"还有多久下课":"已经上课"):hasEnd?(remaining?"还有多久上课":"已经休息"):"已经休息";
 $("#timer-value").textContent=!hasEnd&&!D.courses.length?"—":E.duration(remaining&&hasEnd?s.end-t:t-s.start);
 const value=hasEnd?(remaining?1-elapsed:elapsed):0;
 if(progressArt)progressArt.update(value,remaining);
 $("#capsule-fill").style.transform="scaleX("+value+")";
 if(page==="progress"){
   $("#capsule").style.setProperty("--position",(value*100)+"%");
   $("#browser-fullscreen").textContent=document.fullscreenElement?"退出浏览器全屏":"浏览器全屏";
 }
 $("#capsule").setAttribute("aria-valuenow",Math.round(value*100));
 $("#capsule-caption").textContent=hasEnd?(remaining?"流逝 · 剩余 ":"累计 · 已过 ")+Math.round(value*100)+"%":"尚无下一节课程";
 $("#toggle-mode").textContent=remaining?"切换为累计时间":"切换为剩余时间";
 $("#toggle-mode").setAttribute("aria-pressed",!remaining);
 const h=E.holiday(t);
 $("#holiday-note").textContent=h?h.name+"假期"+(s.event?" · 当前课表仍有排课，请以校历为准":""):"";
 const identity=s.label+String(s.start);
 if(lastState&&lastState!==identity&&!matchMedia("(prefers-reduced-motion: reduce)").matches)$("#state-label").animate([{opacity:.2},{opacity:1}],{duration:300});
 lastState=identity;
}

/* 单文件入口：每次只挂载一个页面，支持前进/后退及直接链接。 */
(function(){
  const routes={home:"首页",dashboard:"进度看板",focus:"沉浸模式",classic:"经典课表",semester:"学期总览",progress:"进度全屏"};
  const files={"index.html":"home","dashboard.html":"dashboard","focus.html":"focus","classic.html":"classic","semester.html":"semester","progress.html":"progress"};
  function mount(){
    const page=location.hash.slice(1);
    document.body.dataset.page=Object.hasOwn(routes,page)?page:"home";
    renderSchedulePage();
    for(const link of document.querySelectorAll("a[href]")){
      const file=link.getAttribute("href").replace(/^\.\//,"");
      if(Object.hasOwn(files,file))link.setAttribute("href","#"+files[file]);
    }
    document.title=routes[document.body.dataset.page]+" · 课表空白模板";
    window.scrollTo({top:0,left:0,behavior:"instant"});
  }
  window.addEventListener("hashchange",mount);
  mount();
})();
